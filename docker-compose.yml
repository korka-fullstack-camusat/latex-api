version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: latex_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-latex_api}
      POSTGRES_USER: ${POSTGRES_USER:-latex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-latex_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-latex_user} -d ${POSTGRES_DB:-latex_api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: latex_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DATABASE_URL: postgresql://${POSTGRES_USER:-latex_user}:${POSTGRES_PASSWORD:-latex_pass}@db:5432/${POSTGRES_DB:-latex_api}
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
